plugins {
    id 'com.android.application'
}

android {
    namespace 'app.nearchuckle.farcry'
    compileSdk 34

    defaultConfig {
        applicationId "app.nearchuckle.farcry"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // One project-pinned signing key for every build type: APKs from any CI
    // run share the same signature, so a new build installs OVER the existing
    // app (update) instead of requiring uninstall+reinstall. Without this,
    // each CI runner generated its own random debug key and Android rejected
    // every update ("App not installed").
    signingConfigs {
        projectKey {
            storeFile rootProject.file('signing/nearchuckle.keystore')
            storePassword 'nearchuckle'
            keyAlias 'nearchuckle'
            keyPassword 'nearchuckle'
        }
    }

    // Native modules are prebuilt by scripts/build_native.sh and picked up
    // from src/main/jniLibs/<abi>.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        // engine modules are dlopen()ed by name at runtime -> must be extracted
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.projectKey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.projectKey
        }
    }

    lint {
        abortOnError false
    }
}

// empty dependencies: the whole engine is bundled as native libraries
dependencies {
}
